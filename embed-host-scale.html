<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MakeCode (Full Editor)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { height: 100%; margin: 0; }
    #app { position: fixed; inset: 0; background: #000; }
    #app > iframe {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      border: 0; background: #000;
    }
  </style>
</head>
<body>
  <div id="app">
    <iframe
      title="MakeCode Editor"
      src="index.html#editor"
      allow="camera; microphone; fullscreen; clipboard-write; gamepad; usb; serial"
      allowfullscreen
      referrerpolicy="no-referrer">
    </iframe>
  </div>
</body>
</html>
